<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Login</title>
    <!-- ===== ICONOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <!-- ===== CSS - GENERAL ===== -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- ===== CSS - HEADER ===== -->
    <link rel="stylesheet" href="../assets/css/login/login-header.css">
    <!-- ===== CSS - MAIN ===== -->
    <link rel="stylesheet" href="../assets/css/login/login-main.css">
    <!-- ===== CSS - FOOTER ===== -->
    <link rel="stylesheet" href="../assets/css/login/login-footer.css">
</head>
<body>
    <!--! ================== -->
    <!--! ===== HEADER ===== -->
    <!--! ================== -->
    <header>
        <img class="icon" src="../assets/img/logo-icon.svg" alt="logo">
        <img class="text" src="../assets/img/logo-text.svg">
    </header>

    <!--! ================== -->
    <!--! ===== MAIN ===== -->
    <!--! ================== -->
    <main>
        <!-- ===== Login Titulo ===== -->
        <section class="section-title">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tus datos para iniciar sesión</p>
        </section>
        <!-- ===== Login Form ===== -->
        <form class="section-form">
            <div class="form-correo">
                <label for="email">Correo electrónico</label>
                <div class="correo-group">
                    <i class="fa-regular fa-envelope fa-2xs" style="color: #5c5c5c93;"></i>
                    <input type="email" id="email" placeholder="ejemplo@mail.com">
                </div>
            </div>
            <div class="form-contraseña">
                <label for="password">Contraseña</label>
                <div class="contraseña-group">
                    <i class="fa-solid fa-unlock-keyhole fa-2xs" style="color: #5c5c5c8f;"></i>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña">
                </div>
            </div>
        
        <!-- ===== Login Button ===== -->
        <section class="section-btn">
            <button type="submit">Iniciar Sesión</button>
            <div class="divider">
                <div></div>
                <label>o</label>
                <div></div>
            </div>
            <a href="#">¿Olvidaste tu contraseña?</a>
        </section>
        </form>
    </main>

    <!--! ================== -->
    <!--! ===== FOOTER ===== -->
    <!--! ================== -->
    <footer>
        <div class="container-foot">
            <button class="btn-español btn-idioma"><img src="../assets/img/icons/es.svg">Español</button>
            <button class="btn-english btn-idioma"><img src="../assets/img/icons/um.svg"> English</button>
        </div>
    </footer>

    <!--! ------------------ -->
    <!--! ----- SCRIPT ----- -->
    <!--! ------------------ -->
    <script src="../assets/js/login/login.js"></script>
</body>
</html>
