<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Gestiona tu stock y ventas</title>
    <meta name="description" content="Controla stock, registra ventas y administra tu inventario de forma simple y eficiente con StockFlow.">
    <!-- ----- Font Awesome ----- -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- ----- Estilos ----- -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/index/index.css">
</head>
<body>
    <!-- ---------- -->
    <!--   Header   -->
    <!-- ---------- -->
    <header>
        <a href="index.html">
            <img class="header-icon" src="assets/img/logo/logo-icon.svg" alt="Icono de StockFlow">
            <img class="header-txt" src="assets/img/logo/logo-text.svg" alt="StockFlow">
        </a>
    </header>

    <!-- -------- -->
    <!--   Main   -->
    <!-- -------- -->
    <main>
        <section class="hero">
            <!-- Textos -->
            <div class="hero-textos">
                <!-- Titulo -->
                <h1 class="hero-titulo">
                    Gestiona tu stock y ventas desde <span>un solo lugar</span>
                </h1>
                <!-- Subtitulo -->
                <p class="hero-subtitulo">Controla stock, registra ventas y administra tu inventario de forma simple y eficiente.</p>
            </div>

            <!-- Botones -->
            <div class="hero-botones">
                <!-- Botón iniciar sesión -->
                <button id="btn-login" type="button">
                    <span>Iniciar sesión</span>
                    <i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>
                </button>
                <!-- Botón conocer más -->
                <button id="btn-more" type="button">
                    <span>Conocer más</span>
                    <i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>
                </button>
            </div>
        </section>
    </main>

    <!-- ------ -->
    <!--   JS   -->
    <!-- ------ -->
    <script src="assets/js/index/botones.js"></script>
</body>
</html>
